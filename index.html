<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Where Is The Teddy Bear?</title>
<style>
:root{
  --bg1:#1b1b3a; --bg2:#2d1b52; --bg3:#0f2942;
  --card:#ffffff; --ink:#1c2340; --muted:#6b7391;
  --accent:#ff8a3d; --accent2:#ffc93c;
  --good:#22c58b; --bad:#ff5d73; --blue:#4d8bff; --purple:#9b6bff;
  --on:#ff8a1f; --under:#2f7bff;
  --shadow:0 8px 0 rgba(0,0,0,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  font-family:'Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));
  background-attachment:fixed;color:var(--ink);
  overflow-x:hidden;overscroll-behavior:none;
}
#top{position:sticky;top:0;z-index:50}
.brand{background:#111c37;color:#f5cf6b;text-align:center;font-size:11px;font-weight:800;
  letter-spacing:2px;text-transform:uppercase;padding:5px 8px}
#app{max-width:640px;margin:0 auto;padding:0 12px 70px;min-height:100vh}
.topbar{display:flex;align-items:center;gap:8px;padding:8px 12px;max-width:640px;margin:0 auto;
  background:rgba(27,27,58,.85);backdrop-filter:blur(6px)}
.tbtn{border:none;border-radius:14px;padding:10px 12px;font-size:18px;font-weight:800;
  background:rgba(255,255,255,.16);color:#fff;cursor:pointer;line-height:1;
  min-width:46px;min-height:46px;display:flex;align-items:center;justify-content:center}
.tbtn:active{transform:scale(.94)}
.pill{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;
  background:rgba(255,255,255,.14);color:#fff;border-radius:14px;
  padding:10px 8px;font-weight:800;font-size:15px;min-height:46px}
.pill .sc{color:var(--accent2)}
.hide{display:none !important}
.foot{text-align:center;color:#fff;opacity:.45;font-size:11px;margin-top:22px;letter-spacing:.5px}

.hero{text-align:center;color:#fff;padding:14px 6px 6px}
.hero h1{margin:0;font-size:29px;letter-spacing:.5px;line-height:1.15;
  background:linear-gradient(90deg,#ffd166,#ff8a3d,#ff5d73,#9b6bff,#4d8bff);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.hero p{margin:6px 0 0;opacity:.8;font-size:14px}
.cbadge{display:inline-block;margin-top:8px;background:#111c37;color:#f5cf6b;border:1px solid #f5cf6b;
  border-radius:999px;padding:4px 12px;font-size:11px;font-weight:800;letter-spacing:1.5px}
.wordstrip{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:14px 0 6px}
.wchip{background:rgba(255,255,255,.95);color:var(--ink);border-radius:16px;
  padding:6px 12px 6px 6px;font-size:15px;font-weight:800;border:none;cursor:pointer;min-height:52px;
  display:flex;align-items:center;gap:6px}
.wchip img{height:40px;width:52px;object-fit:contain}
.wchip.q{background:linear-gradient(135deg,#ffd166,#ff8a3d);padding:6px 14px}
.wchip:active{transform:scale(.93)}

.grid{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}
@media(min-width:520px){.grid{grid-template-columns:1fr 1fr}}
.lvl{display:flex;align-items:center;gap:12px;background:var(--card);
  border-radius:18px;padding:13px 14px;border:none;text-align:left;
  cursor:pointer;box-shadow:var(--shadow);width:100%;color:var(--ink)}
.lvl:active{transform:translateY(3px);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.lvl .ic{font-size:26px;width:50px;height:50px;flex:0 0 50px;border-radius:14px;
  display:flex;align-items:center;justify-content:center;background:#f0f2fa}
.lvl .tx{flex:1;min-width:0;display:block}
.lvl .tt{display:block;font-weight:800;font-size:15px;line-height:1.25}
.lvl .ss{display:block;font-size:12px;color:var(--muted);margin-top:3px;line-height:1.3}
.lvl .st{font-size:20px;flex:0 0 auto}
.lvl.done{background:#e9fbf4}
.lvl.done .ic{background:#c9f3e2}

.card{background:var(--card);border-radius:22px;padding:14px 12px;
  box-shadow:0 10px 30px rgba(0,0,0,.28);margin-top:10px}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.qnum{font-size:12px;font-weight:800;color:var(--muted);letter-spacing:1px}
.bar{height:8px;background:#eceffa;border-radius:99px;overflow:hidden;margin:6px 0 10px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--accent2),var(--accent));width:0;transition:width .35s}
.prompt{font-size:18px;font-weight:800;text-align:center;line-height:1.4;margin:4px 0 8px}
.sub{font-size:13px;color:var(--muted);text-align:center;margin:0 0 10px}

.playrow{display:flex;gap:10px;justify-content:center;margin:8px 0 8px;flex-wrap:wrap}
.pbtn{border:none;border-radius:999px;padding:13px 22px;font-size:16px;font-weight:800;
  background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.2);min-height:52px}
.pbtn:active{transform:translateY(4px);box-shadow:none}
.speaking{animation:pulse .7s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.cta{width:100%;border:none;border-radius:16px;padding:15px;font-size:17px;font-weight:800;
  background:linear-gradient(135deg,var(--accent),#ff5d73);color:#fff;cursor:pointer;
  box-shadow:0 5px 0 rgba(0,0,0,.2);margin-top:10px;min-height:54px}
.cta:active{transform:translateY(4px);box-shadow:none}
.cta.g{background:linear-gradient(135deg,#2fd08a,#12a06a)}
.cta.r{background:linear-gradient(135deg,#ff7a8a,#e84a5f)}
.cta.ghost{background:#eef1fa;color:var(--ink);box-shadow:0 5px 0 #d7dcee}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fb{margin-top:10px;border-radius:14px;padding:11px;font-weight:800;text-align:center;font-size:15px}
.fb.ok{background:#e7fbf3;color:#0e8a5f}
.fb.no{background:#ffeef1;color:#c02c46}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shakeit{animation:shake .4s}
@keyframes pop{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}

/* pictures from the book */
img.pic{display:block;max-width:100%;object-fit:contain;-webkit-user-drag:none;user-select:none;pointer-events:none}

/* ---------- G1 eggs ---------- */
.eggs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.eggbox{background:#fbfcff;border:3px solid #e7eaf5;border-radius:20px;padding:8px 4px 10px;
  text-align:center;cursor:pointer;user-select:none}
.eggbox:active{transform:scale(.96)}
.eggbox.open{border-color:var(--good);background:#e7fbf3;cursor:default}
.eggbox svg{width:100%;height:120px;display:block}
.eggbox .cap{font-size:19px;font-weight:900;letter-spacing:.5px;min-height:24px;color:var(--ink)}
.eggbox .hits{font-size:12px;color:var(--muted);font-weight:700}
.fruitpop{height:120px;display:flex;align-items:center;justify-content:center;animation:pop .5s}
.fruitpop img{max-height:110px;max-width:92%}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-9deg)}75%{transform:rotate(9deg)}}
.wob{animation:wob .35s}

/* ---------- G2 floating ---------- */
.sky{position:relative;height:54vh;min-height:320px;border-radius:20px;overflow:hidden;
  background:linear-gradient(180deg,#bfe8ff,#e8f8ff 60%,#d6f5e0);border:3px solid #e7eaf5}
.floater{position:absolute;bottom:-130px;width:96px;height:96px;border-radius:22px;background:#fff;
  box-shadow:0 6px 16px rgba(0,0,0,.18);display:flex;align-items:center;justify-content:center;
  cursor:pointer;animation:rise linear infinite;padding:6px}
.floater img{max-width:100%;max-height:100%}
.floater.right{background:#c9f7e3;box-shadow:0 0 0 5px var(--good)}
.floater.wrong{background:#ffe0e6;box-shadow:0 0 0 5px var(--bad)}
@keyframes rise{0%{bottom:-120px}100%{bottom:105%}}

/* ---------- G3 memory ---------- */
.memgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
@media(max-width:400px){.memgrid{gap:6px}}
.mem{position:relative;aspect-ratio:3/4;perspective:700px;cursor:pointer}
.memin{position:absolute;inset:0;transition:transform .4s;transform-style:preserve-3d}
.mem.up .memin{transform:rotateY(180deg)}
.memf,.memb{position:absolute;inset:0;border-radius:14px;display:flex;align-items:center;
  justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.memb{background:linear-gradient(135deg,#6d5bff,#4d8bff);color:#fff;font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.memf{background:#fff;border:3px solid #e7eaf5;transform:rotateY(180deg);padding:4px}
.memf img{max-width:100%;max-height:100%}
.mem.gone{opacity:.25;pointer-events:none}
.mem.hit .memf{border-color:var(--good);background:#e7fbf3}
.countdown{font-size:40px;font-weight:900;text-align:center;color:var(--accent);min-height:48px}

/* ---------- living-room stage ---------- */
.stage{position:relative;width:100%;aspect-ratio:4/3;border-radius:18px;overflow:hidden;
  border:3px solid #e7eaf5;
  background:linear-gradient(180deg,#fdf1b8 0,#fbe9a0 55%,#ffffff 55%,#ffffff 57.5%,#d5edf6 57.5%,#bfe2ef 100%)}
.stage>*{position:absolute}
.stage .frame{left:44%;top:4%;width:14%}
.stage .rug{left:33%;bottom:1%;width:40%;z-index:1}
.stage .sofa{left:3%;bottom:33.7%;width:46%;z-index:3}
.stage .leg{width:2.4%;border-radius:2px 2px 4px 4px;background:linear-gradient(90deg,#6b4434,#4a2d22);z-index:2}
.stage .shade{border-radius:50%;background:rgba(40,60,90,.16);z-index:1}
.stage .board{background:linear-gradient(180deg,#8a5a3c,#6b4434);border-radius:4px;z-index:3}
.stage .tv{left:69%;bottom:50%;width:26%;z-index:3}
.stage .ted{transform:translateX(-50%);z-index:4;height:auto}
.stage .ted.pop{animation:tedpop .55s}
@keyframes tedpop{0%{transform:translateX(-50%) scale(.2)}70%{transform:translateX(-50%) scale(1.15)}100%{transform:translateX(-50%) scale(1)}}
.stage .hl{border:4px dashed #fff;border-radius:16px;z-index:5;box-shadow:0 0 0 3px var(--good);animation:pulse .9s infinite}

/* bubbles for Q & A */
.bub{display:flex;align-items:center;gap:8px;border-radius:16px;padding:9px 12px;margin-top:8px;
  font-weight:800;font-size:16px;background:#f3f5fc;color:var(--ink);transition:all .2s;opacity:.55}
.bub .bi{font-size:22px}
.bub.now{opacity:1;background:#fff4d6;box-shadow:0 0 0 3px var(--accent2);transform:scale(1.02)}
.bub.ans.now{background:#e5f0ff;box-shadow:0 0 0 3px var(--under)}

/* ON / UNDER buttons */
.prepbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.prep{border:none;border-radius:20px;padding:8px 6px 10px;cursor:pointer;color:#fff;font-weight:900;
  font-size:22px;letter-spacing:1px;min-height:110px;box-shadow:0 6px 0 rgba(0,0,0,.22);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.prep svg{width:86px;height:64px}
.prep.on{background:linear-gradient(135deg,#ffb04d,var(--on))}
.prep.under{background:linear-gradient(135deg,#6aa6ff,var(--under))}
.prep:active{transform:translateY(4px);box-shadow:none}
.prep.right{box-shadow:0 0 0 6px var(--good)}
.prep.wrong{animation:shake .4s;opacity:.6}

/* G6 choose the picture */
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.choice{border:none;padding:0;background:none;cursor:pointer;border-radius:18px;position:relative}
.choice .stage{border-width:4px}
.choice:active{transform:scale(.97)}
.choice.right .stage{border-color:var(--good);box-shadow:0 0 0 4px var(--good)}
.choice.wrong{animation:shake .4s}
.choice.wrong .stage{border-color:var(--bad);opacity:.55}
.choices .choice:nth-child(3){grid-column:1 / span 2;width:50%;justify-self:center}

.result{text-align:center;color:#fff;padding:22px 10px}
.result .em{font-size:76px;line-height:1;animation:pop .5s}
.result h2{margin:12px 0 4px;font-size:26px}
.result p{opacity:.85;margin:0 0 6px}
.bigscore{font-size:52px;font-weight:900;color:var(--accent2);margin:10px 0}
.stars{font-size:34px;letter-spacing:4px}
.rbrand{display:inline-block;margin:8px 0 2px;color:#f5cf6b;font-size:12px;font-weight:800;letter-spacing:2px}
.brk{background:rgba(255,255,255,.1);border-radius:16px;padding:12px;margin:14px 0;text-align:left}
.brk div{display:flex;justify-content:space-between;font-size:13px;padding:5px 4px;color:#fff;border-bottom:1px solid rgba(255,255,255,.1)}
.brk div:last-child{border:none}

#start{position:fixed;inset:0;z-index:300;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:linear-gradient(160deg,var(--bg1),var(--bg2) 45%,var(--bg3));color:#fff;text-align:center;padding:20px;cursor:pointer}
#start img{width:150px;animation:pulse 1.4s infinite}
#start .go{margin-top:18px;background:linear-gradient(135deg,var(--accent),#ff5d73);border-radius:999px;
  padding:18px 34px;font-size:22px;font-weight:900;box-shadow:0 6px 0 rgba(0,0,0,.25)}

#confetti{position:fixed;inset:0;pointer-events:none;z-index:99}
.cf{position:absolute;width:10px;height:16px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.1}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:98;
  background:rgba(0,0,0,.82);color:#fff;padding:12px 20px;border-radius:99px;
  font-weight:800;font-size:15px;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.on{opacity:1}
</style>
</head>

  <div class="brand" id="brandStrip">👑 QUEEN ENGLISH CENTER</div>

    <button class="tbtn" id="homeBtn" title="Home">🏠</button>
    <div class="pill"><span id="pillTitle">Game</span> <span class="sc">⭐ <b id="scoreVal">0</b></span></div>
    <button class="tbtn hide" id="repeatBtn" title="Repeat audio">🔁</button>
  </div>
</div>
<div id="app">
  <div id="screen"></div>

</div>

/* ---------- beeps ---------- */
let AC=null;
function ac(){ if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}} if(AC&&AC.state==="suspended")AC.resume(); return AC; }
function beep(freq,dur,type,vol){
  const c=ac(); if(!c)return;
  const o=c.createOscillator(), g=c.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  g.gain.setValueAtTime(vol||.16,c.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
  o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime+dur);
}
const sTap =()=>beep(620,.07,"triangle",.09);
function sCrack(){ beep(180,.09,"square",.12); setTimeout(()=>beep(120,.12,"square",.1),70); }
function sGood(){ [660,880,1174].forEach((f,i)=>setTimeout(()=>beep(f,.18,"triangle",.14),i*85)); }
function sBad(){ beep(220,.22,"sawtooth",.1); setTimeout(()=>beep(160,.28,"sawtooth",.1),120); }
function sWin(){ [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>beep(f,.32,"triangle",.16),i*130)); }

/* ---------- voice: embedded MP3 (works on iPhone + Android, offline) ---------- */
const AUD = new Audio(); AUD.preload="auto";
const URLS = {};
let TOK = 0, spTimer = null;
function clipURL(k){
  if(URLS[k]) return URLS[k];
  const b=CLIPS[k]; if(!b) return null;
  const bin=atob(b), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  return URLS[k]=URL.createObjectURL(new Blob([u],{type:"audio/mpeg"}));
}
function stopSpeak(){ TOK++; clearTimeout(spTimer); try{AUD.pause();}catch(e){} }
/* play one clip; cb fires after the clip's real length (no reliance on 'ended') */
function playKey(k,cb){
  stopSpeak(); const my=TOK;
  const url=clipURL(k);
  const fire=()=>{ if(my!==TOK) return; if(cb) cb(); };
  if(!url){ spTimer=setTimeout(fire,800); return; }
  try{ AUD.src=url; AUD.currentTime=0; const p=AUD.play(); if(p&&p.catch)p.catch(()=>{}); }catch(e){}
  spTimer=setTimeout(fire,(DUR[k]||1.4)*1000+250);
}
function speak(text,cb){ const k=String(text).toLowerCase(); S.replay=()=>speak(text); playKey(k,cb); }
/* question → pause → answer */
function sayQA(answer,onQ,onA,done){
  S.replay=()=>sayQA(answer,onQ,onA,done&&null);
  if(onQ)onQ();
  playKey(QUESTION.toLowerCase(),()=>{
    const my=TOK;
    spTimer=setTimeout(()=>{ if(my!==TOK)return; if(onA)onA(); playKey(answer.toLowerCase(),done); },380);
  });
}
function replay(){ if(S.replay) S.replay(); }

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove("on"),1600); }
function confetti(n){
  const box=$("#confetti"), cols=["#ffd166","#ff8a3d","#ff5d73","#9b6bff","#4d8bff","#22c58b"];
  for(let i=0;i<(n||60);i++){
    const d=document.createElement("div"); d.className="cf";
    d.style.left=Math.random()*100+"vw"; d.style.top="-20px";
    d.style.background=cols[i%cols.length];
    d.style.animationDuration=(1.6+Math.random()*1.6)+"s";
    d.style.animationDelay=(Math.random()*.5)+"s";
    box.appendChild(d); setTimeout(()=>d.remove(),4200);
  }
}

function makeOrder(n,total){ const base=[...Array(n).keys()]; let o=[]; while(o.length<total){ let s=shuffle(base); if(o.length&&s[0]===o[o.length-1]&&n>1) s.push(s.shift()); o=o.concat(s);} return o.slice(0,total); }
function startLevel(n){
  stopSpeak();
  S.level=n; S.i=0; S.first=true; S.stageScore=0; S.total=LEVELS[n].n; S.replay=null;
  $("#pillTitle").textContent="Game "+(n+1);
  $("#repeatBtn").classList.remove("hide");
  S.order = n>=3 ? makeOrder(SPOTS.length,S.total) : makeOrder(N,Math.max(S.total,N));
  renderQ();
}
function head(sub){
  const pct=(S.i/S.total)*100;
  return '<div class="qhead"><span class="qnum">'+(S.i+1)+' / '+S.total+'</span>'+
         '<span class="qnum">⭐ '+S.stageScore+'</span></div>'+
         '<div class="bar"><i style="width:'+pct+'%"></i></div>'+
         (sub?'<div class="sub">'+sub+'</div>':'');
}
function next(){ S.i++; S.first=true; if(S.i>=S.total) stageDone(); else renderQ(); }
function renderQ(){ window.scrollTo(0,0); [q1,q2,q3,q4,q5,q6][S.level](); }
function fb(cls,html){ const f=$("#fb"); if(!f)return; f.className="fb "+cls; f.innerHTML=html; }

/* ============================================================
   GAME 1 — EGG SURPRISE
   ============================================================ */
function q1(){
  $("#repeatBtn").classList.add("hide");
  const eggs=shuffle([...Array(N).keys()]); let opened=0; S.i=0; S.stageScore=0;
  screen.innerHTML='<div class="card">'+
    '<div class="prompt">🥚 Tap each egg 3 times!</div>'+
    '<div class="sub">A picture pops out. Listen and say it.</div>'+
    '<div class="eggs">'+eggs.map((wi,k)=>'<div class="eggbox" data-k="'+k+'" data-w="'+wi+'">'+
        '<div class="art">'+eggSVG(0)+'</div><div class="cap"></div><div class="hits">tap 3 times</div></div>').join("")+
    '</div><div id="fb"></div></div>';
  const hits=Array(N).fill(0);
  screen.querySelectorAll(".eggbox").forEach(box=>{
    box.onclick=()=>{
      ac(); const k=+box.dataset.k, wi=+box.dataset.w;
      if(box.classList.contains("open")){ speak(WORDS[wi].w); return; }
      hits[k]++; const art=box.querySelector(".art");
      if(hits[k]<3){
        sCrack(); art.innerHTML=eggSVG(hits[k]);
        art.classList.remove("wob"); void art.offsetWidth; art.classList.add("wob");
        box.querySelector(".hits").textContent=(3-hits[k])+" more tap"+(3-hits[k]>1?"s":"");
      }else{
        sGood(); confetti(24); box.classList.add("open");
        art.innerHTML='<div class="fruitpop">'+pic(WORDS[wi].k)+'</div>';
        box.querySelector(".cap").textContent=WORDS[wi].w;
        box.querySelector(".hits").textContent="🔊 tap to listen";
        speak(WORDS[wi].w);
        S.first=true; award(); opened++; S.i=opened;
        fb("ok","✅ "+WORDS[wi].w+"! Say it: "+WORDS[wi].w);
        if(opened>=N) setTimeout(()=>{ if(S.level===0){ S.i=S.total; stageDone(); } },1900);
      }
    };
  });
}

/* ============================================================
   GAME 2 — LISTEN & CATCH
   ============================================================ */
function q2(){
  const target=S.order[S.i], lanes=shuffle([...Array(N).keys()]);
  screen.innerHTML='<div class="card">'+head("Listen, then tap the right picture")+
    '<div class="playrow"><button class="pbtn" id="pl">🔊 Listen</button></div>'+
    '<div class="sky">'+lanes.map((wi,k)=>{
        const dur=(8.5+k*1.3).toFixed(1), delay=(k*1.6).toFixed(1), left=3+k*(78/(N-1||1));
        return '<div class="floater" data-w="'+wi+'" style="left:'+left+'%;animation-duration:'+dur+'s;animation-delay:-'+delay+'s">'+pic(WORDS[wi].k)+'</div>';
      }).join("")+
    '</div><div id="fb"></div></div>';
  const say=()=>speak(WORDS[target].w);
  $("#pl").onclick=()=>{ac();sTap();say();};
  setTimeout(()=>{ if(S.level===1) say(); },350);
  let lock=false;
  screen.querySelectorAll(".floater").forEach(el=>{
    el.onclick=()=>{
      ac(); if(lock)return;
      if(+el.dataset.w===target){
        lock=true; el.classList.add("right"); sGood(); confetti(30);
        const p=award(); fb("ok","✅ Yes! "+WORDS[target].w+" +"+p);
        speak(WORDS[target].w); setTimeout(next,1300);
      }else{
        el.classList.add("wrong"); sBad(); S.first=false;
        fb("no","❌ Listen again 🔊");
        setTimeout(()=>el.classList.remove("wrong"),450); setTimeout(say,500);
      }
    };
  });
}

/* ============================================================
   GAME 3 — MEMORY MATCH (5-second preview, then shuffle)
   ============================================================ */
function q3(){
  $("#repeatBtn").classList.add("hide");
  S.i=0; S.stageScore=0;
  const deck=shuffle([...Array(N).keys(),...Array(N).keys()]);
  screen.innerHTML='<div class="card"><div class="prompt">👀 Look carefully!</div>'+
    '<div class="countdown" id="cd">5</div>'+
    '<div class="memgrid" id="mg">'+deck.map((wi,k)=>'<div class="mem up" data-k="'+k+'" data-w="'+wi+'">'+
        '<div class="memin"><div class="memb">❓</div><div class="memf">'+pic(WORDS[wi].k)+'</div></div></div>').join("")+
    '</div><div id="fb"></div></div>';
  let n=5; const lv=S.level;
  const tick=setInterval(()=>{
    if(S.level!==lv){ clearInterval(tick); return; }
    n--; beep(700,.1,"triangle",.1);
    if(n>0){ $("#cd").textContent=n; }
    else{
      clearInterval(tick); $("#cd").textContent="🔀";
      screen.querySelectorAll(".mem").forEach(m=>m.classList.remove("up"));
      setTimeout(()=>{
        if(S.level!==lv) return;
        const mg=$("#mg"); shuffle([...mg.children]).forEach(k=>mg.appendChild(k));
        $("#cd").textContent=""; screen.querySelector(".prompt").textContent="🃏 Find the pairs!";
        arm();
      },520);
    }
  },900);
  function arm(){
    let open=[], lock=false, found=0;
    screen.querySelectorAll(".mem").forEach(m=>{
      m.onclick=()=>{
        ac(); if(lock||m.classList.contains("up")||m.classList.contains("gone"))return;
        sTap(); m.classList.add("up"); open.push(m);
        if(open.length===2){
          lock=true; const [a,b]=open;
          if(a.dataset.w===b.dataset.w){
            const wi=+a.dataset.w; sGood(); confetti(24); speak(WORDS[wi].w);
            a.classList.add("hit"); b.classList.add("hit");
            const p=award(); S.first=true; found++; S.i=found;
            fb("ok","✅ "+WORDS[wi].w+"! +"+p);
            setTimeout(()=>{ a.classList.add("gone"); b.classList.add("gone"); open=[]; lock=false;
              if(found>=N && S.level===lv){ S.i=S.total; stageDone(); } },900);
          }else{
            sBad(); S.first=false; fb("no","❌ Not a pair — try again!");
            setTimeout(()=>{ a.classList.remove("up"); b.classList.remove("up"); open=[]; lock=false; },900);
          }
        }
      };
    });
  }
}

/* ============================================================
   GAME 4 — ASK & ANSWER (listen to Q + A, then say both)
   ============================================================ */
function q4(){
  const sp=SPOTS[S.order[S.i]];
  screen.innerHTML='<div class="card">'+head("Listen, then ask and answer 🎤")+
    room(sp.id,{pop:true})+
    '<div class="bub" id="bq"><span class="bi">❓</span>'+QUESTION+'</div>'+
    '<div class="bub ans" id="ba"><span class="bi">'+(sp.prep==="on"?"🟧":"🟦")+'</span>'+sp.a+'</div>'+
    '<div class="playrow"><button class="pbtn" id="pl">🔊 Listen again</button></div>'+
    '<div class="prompt" id="turn">👂 Listen…</div><div id="acts"></div><div id="fb"></div></div>';
  const lv=S.level;
  const run=()=>{
    $("#turn").textContent="👂 Listen…"; $("#acts").innerHTML=""; $("#pl").classList.add("speaking");
    sayQA(sp.a,
      ()=>{ $("#bq").classList.add("now"); $("#ba").classList.remove("now"); },
      ()=>{ $("#bq").classList.remove("now"); $("#ba").classList.add("now"); },
      ()=>{
        if(S.level!==lv) return;
        $("#pl").classList.remove("speaking"); $("#ba").classList.remove("now");
        $("#turn").innerHTML="🎤 Your turn — ask and answer!";
        $("#acts").innerHTML='<div class="row2"><button class="cta g" id="ok">✅ I said it</button><button class="cta r" id="no">🔁 Again</button></div>';
        $("#ok").onclick=()=>{ ac(); sGood(); confetti(26); const p=award(); fb("ok","🌟 Great speaking! +"+p); $("#acts").innerHTML=""; setTimeout(next,1000); };
        $("#no").onclick=()=>{ ac(); sTap(); S.first=false; run(); };
      });
    S.replay=run;
  };
  $("#pl").onclick=()=>{ac();sTap();run();};
  setTimeout(()=>{ if(S.level===lv) run(); },450);
}

/* ============================================================
   GAME 5 — ON OR UNDER?
   ============================================================ */
function q5(){
  const sp=SPOTS[S.order[S.i]];
  screen.innerHTML='<div class="card">'+head("Where is the teddy bear? Tap ON or UNDER")+
    room(sp.id,{pop:true})+
    '<div class="prepbtns">'+
      '<button class="prep on" data-p="on">'+iconOn()+'ON</button>'+
      '<button class="prep under" data-p="under">'+iconUnder()+'UNDER</button>'+
    '</div><div id="fb"></div></div>';
  const lv=S.level, askQ=()=>speak(QUESTION);
  setTimeout(()=>{ if(S.level===lv) askQ(); },450);
  let lock=false;
  screen.querySelectorAll(".prep").forEach(b=>{
    b.onclick=()=>{
      ac(); if(lock)return;
      if(b.dataset.p===sp.prep){
        lock=true; b.classList.add("right"); sGood(); confetti(28);
        const p=award(); fb("ok","✅ "+sp.a+" +"+p);
        S.replay=()=>speak(sp.a);
        setTimeout(()=>{ if(S.level===lv) speak(sp.a,()=>setTimeout(()=>{ if(S.level===lv) next(); },500)); },350);
      }else{
        b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
        sBad(); S.first=false; fb("no","❌ Look again — "+b.dataset.p.toUpperCase()+"? Try the other one!");
        speak(b.dataset.p);
        setTimeout(()=>b.classList.remove("wrong"),450);
      }
    };
  });
}

/* ============================================================
   GAME 6 — FIND TEDDY (listen, choose 1 of 3 rooms)
   ============================================================ */
function q6(){
  const ti=S.order[S.i], sp=SPOTS[ti];
  const others=shuffle([...Array(SPOTS.length).keys()].filter(i=>i!==ti)).slice(0,2);
  const opts=shuffle([ti,...others]);
  screen.innerHTML='<div class="card">'+head("Listen and tap the right picture")+
    '<div class="playrow"><button class="pbtn" id="pl">🔊 Listen</button></div>'+
    '<div class="choices">'+opts.map(i=>'<button class="choice" data-i="'+i+'">'+room(SPOTS[i].id)+'</button>').join("")+
    '</div><div id="fb"></div></div>';
  const lv=S.level, say=()=>{ $("#pl").classList.add("speaking"); sayQA(sp.a,null,null,()=>{ const b=$("#pl"); if(b)b.classList.remove("speaking"); }); };
  $("#pl").onclick=()=>{ac();sTap();say();};
  setTimeout(()=>{ if(S.level===lv) say(); },450);
  let lock=false;
  screen.querySelectorAll(".choice").forEach(c=>{
    c.onclick=()=>{
      ac(); if(lock)return;
      if(+c.dataset.i===ti){
        lock=true; c.classList.add("right"); sGood(); confetti(30);
        const p=award(); fb("ok","✅ "+sp.a+" +"+p);
        setTimeout(()=>{ if(S.level===lv) speak(sp.a,()=>setTimeout(()=>{ if(S.level===lv) next(); },500)); },300);
      }else{
        c.classList.remove("wrong"); void c.offsetWidth; c.classList.add("wrong");
        sBad(); S.first=false; fb("no","❌ Not there — listen again 🔊");
        setTimeout(()=>{ c.classList.remove("wrong"); },450);
        setTimeout(()=>{ if(S.level===lv) say(); },550);
      }
    };
  });
}

/* ============================================================
   STAGE DONE / FINAL
   ============================================================ */
function stageDone(){
  stopSpeak();
  S.done[S.level]=true; S.stageScores[S.level]=S.stageScore;
  sWin(); confetti(90);
  const max=S.total*10, pct=Math.round(S.stageScore/max*100);
  const stars=pct>=90?"⭐⭐⭐":pct>=70?"⭐⭐":"⭐", emj=pct>=90?"🏆":pct>=70?"🎉":"👍";
  const allDone=S.done.every(Boolean);
  $("#repeatBtn").classList.add("hide"); S.replay=null;
  screen.innerHTML='<div class="result"><div class="em">'+emj+'</div>'+
    '<h2>Game '+(S.level+1)+' complete!</h2><div class="stars">'+stars+'</div>'+
    '<div class="bigscore">'+S.stageScore+' / '+max+'</div><p>Total score: '+S.score+'</p>'+
    '<div class="rbrand">👑 '+CENTER+'</div>'+
    '<div style="margin-top:14px">'+
    (allDone?'<button class="cta g" id="fin">🏆 See my final result</button>':'<button class="cta" id="nx">▶ Next game</button>')+
    '<button class="cta ghost" id="hm">📋 Back to games</button>'+
    '<button class="cta ghost" id="rt">🔁 Play this game again</button></div></div>';
  $("#hm").onclick=()=>{sTap();goHome();};
  $("#rt").onclick=()=>{sTap();S.score-=S.stageScore;S.stageScores[S.level]=0;setScore();startLevel(S.level);};
  if($("#nx"))$("#nx").onclick=()=>{ sTap(); let n=S.done.findIndex(d=>!d); if(n<0)n=(S.level+1)%NG; startLevel(n); };
  if($("#fin"))$("#fin").onclick=()=>{sTap();finalScreen();};
  window.scrollTo(0,0);
}
function finalScreen(){
  stopSpeak(); sWin(); confetti(200);
  setTimeout(()=>confetti(150),900); setTimeout(()=>confetti(150),1800);
  const max=LEVELS.reduce((s,l)=>s+l.n*10,0), total=S.score, pct=Math.round(total/max*100);
  const stars=pct>=90?"⭐⭐⭐⭐⭐":pct>=80?"⭐⭐⭐⭐":pct>=65?"⭐⭐⭐":pct>=50?"⭐⭐":"⭐";
  const title=pct>=90?"SUPER STAR!":pct>=75?"EXCELLENT!":pct>=60?"GREAT JOB!":"GOOD TRY!";
  $("#repeatBtn").classList.add("hide"); S.level=null;
  screen.innerHTML='<div class="result"><div class="em">🧸</div>'+
    '<h2>'+title+'</h2><p>You finished all '+NG+' games</p>'+
    '<div class="stars">'+stars+'</div>'+
    '<div class="bigscore">'+total+'<span style="font-size:22px;opacity:.7"> / '+max+'</span></div>'+
    '<p>'+pct+'% — Where is the teddy bear? On the sofa! 🎉</p>'+
    '<div class="rbrand">👑 '+CENTER+'</div>'+
    '<div class="brk">'+LEVELS.map(l=>'<div><span>'+l.tt.replace(/&amp;/g,"&")+'</span><span>'+S.stageScores[l.id]+'/'+(l.n*10)+'</span></div>').join("")+'</div>'+
    '<button class="cta g" id="again">🔄 Play everything again</button>'+
    '<button class="cta ghost" id="hm">📋 Back to games</button></div>';
  $("#hm").onclick=()=>{sTap();goHome();};
  $("#again").onclick=()=>{ sTap(); S.score=0; S.stageScores=Array(NG).fill(0); S.done=Array(NG).fill(false); setScore(); goHome(); };
  window.scrollTo(0,0);
}

/* ============================================================
   BOOT
   ============================================================ */
$("#homeBtn").onclick=()=>{ ac(); sTap(); goHome(); };
$("#repeatBtn").onclick=()=>{ ac(); replay(); };
$("#start").onclick=()=>{ ac(); sTap(); $("#start").remove(); speak(QUESTION); };
setFoot();
goHome();
</script>
</body>
</html>
